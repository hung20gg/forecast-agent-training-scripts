hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ~/data/financial-dataset/train.parquet
  val_files: ~/data/financial-dataset/test.parquet
  max_prompt_length: 4000
  max_response_length: 2000
  shuffle: true
  train_batch_size: 16
  return_raw_chat: true

algorithm:
  adv_estimator: grpo

actor_rollout_ref:
  hybrid_engine: true
  model:
    # path: Qwen/Qwen3-4B-Thinking-2507
    path: Qwen/Qwen3.5-0.8B
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    trust_remote_code: true
    use_remove_padding: false
    
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 8192 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.0
    use_kl_loss: true # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    # Rollout Correction (corrects distribution mismatch between rollout and training)
    use_torch_compile: false # False to disable torch compile

    ppo_epochs: 1
    data_loader_seed: null
    shuffle: true
    
    optim:
      optimizer: AdamW
      lr: 1e-6
            
      lr_warmup_steps: -1 # Prioritized. Negative values mean delegating to lr_warmup_steps_ratio.
      lr_warmup_steps_ratio: 0.05  # the total steps will be injected during runtime
      min_lr_ratio: 0.0   # only used with cosine lr scheduler, default to 0.0
      num_cycles: 0.5     # only used with cosine lr scheduler, default to 0.5
      lr_scheduler_type: cosine  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    
    fsdp_config:
      param_offload: false
      optimizer_offload: true
      fsdp_size: -1
    checkpoint:
      # What to include in saved checkpoints
      # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
      save_contents: ['model', 'extra']
      # For more flexibility, you can specify the contents to load from the checkpoint.
      load_contents: ${actor_rollout_ref.actor.checkpoint.save_contents}
  ref:
    fsdp_config:
      param_offload: false
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    log_prob_micro_batch_size_per_gpu: 1 # should be aligned with actor's ppo_micro_batch_size_per_gpu for better performance

  rollout:
    name: vllm
    mode: async
    multi_turn:
      enable: true
      max_user_turns: 20
      format: hermes
      max_parallel_calls: 4
      max_tool_response_length: 4000
      tool_config_path: ./training-scripts/config/tool_config/mcp_config.yaml # path to the tool config file, only needed when max_user_turns > 0
        
    agent:
      default_agent_loop: tool_agent

    temperature: 0.7
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    max_model_len: 4096
    ignore_eos: false
    enforce_eager: true
    free_cache_engine: true
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 4000
    max_num_seqs: 4
    do_sample: true

    log_prob_micro_batch_size_per_gpu: 1 # should be aligned with ref's log_prob_micro_batch_size_per_gpu for better performance

    n: 5 # for each prompt, sample n responses (i.e. num sample times). set it to values > 1 for grpo, rloo
    calculate_log_probs: true # set to True for computing log probs via rollouts

reward_model:
  enable: false

trainer:
  project_name: finance-grpo
  run_name: qwen3-0.6b
  total_epochs: 3
  logger: ["console","wandb"]

custom_reward_function:
  path: ./training-scripts/config/reward_function.py
  name: compute_score